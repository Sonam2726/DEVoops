<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min-Max Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Price Range Slider</h2>

    <div class="values">
        <span>Min: ₹<span id="minValue">20</span></span>
        <span>Max: ₹<span id="maxValue">80</span></span>
    </div>

    <div class="slider">
        <div class="track"></div>

        <input type="range" id="minSlider" min="0" max="100" value="20">
        <input type="range" id="maxSlider" min="0" max="100" value="80">
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
