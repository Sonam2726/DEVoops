<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript </title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            font-family: Arial, sans-serif;
            background:rgb(251, 199, 207);
        }

        .container{
            width:500px;
            margin:50px auto;
            background:lightblue;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
            text-align:center;
        }

        button{
            margin:10px;
        }

        #message{
            font-size:20px;
            color:blue;
            margin-top:20px;
        }
    </style>

    
    <script>

        function showAlert(){
            alert("Welcome to JavaScript!");
        }

        function changeText(){
            document.getElementById("message").innerHTML="Text Changed Successfully!";
        }

        function changeColor(){
            document.body.style.backgroundColor="lightgrey";
        }

    </script>

</head>

<body>

<div class="container">

<h2>JavaScript </h2>

<!-- Inline JavaScript -->
<button class="btn btn-danger"
onclick="alert('This is an Inline JavaScript Alert!')">
Inline Alert
</button>

<br>

<!-- Internal JavaScript -->
<button class="btn btn-primary"
onclick="showAlert()">
Internal Alert
</button>

<button class="btn btn-success"
onclick="changeText()">
Change Text
</button>

<button class="btn btn-warning"
onclick="changeColor()">
Change Background
</button>

<br><br>

<p id="message">
Click any button to see the effect.
</p>

<!-- Bootstrap Popover -->
<button type="button"
class="btn btn-info"
data-bs-toggle="popover"
title="Popover Example"
data-bs-content="This popover is created successfully.">
Show Popover
</button>
<hr>

<button class="btn btn-dark" onclick="loadData()">
    Fetch Users
</button>

<div id="result" style="margin-top:20px;"></div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

var popoverTriggerList =
document.querySelectorAll('[data-bs-toggle="popover"]');

popoverTriggerList.forEach(function(popover){

    new bootstrap.Popover(popover);

});
function loadData() {

    var xhr = new XMLHttpRequest();

    xhr.open("GET", "https://jsonplaceholder.typicode.com/users", true);

    xhr.onload = function () {

        if (xhr.status == 200) {

            var users = JSON.parse(xhr.responseText);

            var output = "<h4>User Details</h4>";

            users.forEach(function(user) {

                output += "<p><b>Name:</b> "
                        + user.name
                        + "<br><b>Email:</b> "
                        + user.email
                        + "</p><hr>";

            });

            document.getElementById("result").innerHTML = output;
        }
    };

    xhr.send();
}
</script>

</body>
</html>
