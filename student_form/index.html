<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Student Registration</h1>
        <p class="subtitle">Create a sample student account with proper validation.</p>

        <form id="studentForm" novalidate>
          <div class="form-group">
            <label for="name">Student Name</label>
            <input type="text" id="name" name="name" placeholder="Enter full name" />
            <small class="error-text" id="nameError"></small>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter email" />
            <small class="error-text" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile" />
            <small class="error-text" id="mobileError"></small>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" />
            <small class="error-text" id="passwordError"></small>
          </div>

          <div class="form-group">
            <label for="branch">Branch</label>
            <select id="branch" name="branch">
              <option value="">Select branch</option>
              <option value="CSE">CSE</option>
              <option value="ECE">ECE</option>
              <option value="EEE">EEE</option>
              <option value="ME">ME</option>
              <option value="CE">CE</option>
            </select>
            <small class="error-text" id="branchError"></small>
          </div>

          <button type="submit">Register Student</button>
        </form>

        <div id="messageBox" class="message" aria-live="polite"></div>

        <div class="student-list">
          <h2>Registered Students</h2>
          <ul id="studentList"></ul>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
